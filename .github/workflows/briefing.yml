name: GitHub 트렌드 브리핑

on:
  schedule:
    # 화·금 00:00 UTC = 09:00 KST
    # 분야별 트랙은 config.TOPIC_WEEKDAYS 에 따라 금요일 실행분에만 붙는다.
    # Actions 스케줄러는 정각에 요청이 몰려 수 분~수십 분 지연될 수 있다(정상).
    - cron: '0 0 * * 2,5'
  workflow_dispatch: {}

permissions:
  contents: write   # state/seen_repos.json, briefings/ 커밋용
  issues: write     # 브리핑 Issue 발행용

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: 브리핑 실행
        env:
          # GH_PAT 은 선택. 없으면 Actions 가 자동 주입하는 GITHUB_TOKEN 을 쓴다.
          GH_PAT: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # 브리핑 언어. 저장소 Variables 에 BRIEFING_LANG 을 두면 바뀐다 (기본: 한국어)
          BRIEFING_LANG: ${{ vars.BRIEFING_LANG }}
        # Slack 발송과 동시에 briefings/ 에 아카이브를 남긴다(검색용, 비용 없음).
        run: python -m src.main --deliver slack,file

      - name: 소개 이력·아카이브 커밋
        run: |
          git add -A state briefings
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: 브리핑 아카이브 갱신 ($(date -u +%Y-%m-%d))"
          git push
